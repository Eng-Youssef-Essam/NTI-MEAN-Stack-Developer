
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTI Mini Store</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- Start Of Header -->
    <header class="hero">
        <div>
            <h1 class="Title_Project">NTI Mini Store</h1>
        </div>
    </header>
    <!-- End Of Header -->


    <!-- Start Of Main Content -->
    <main class="container">

        <!-- Start Of Section One -->
        <section class="panel">

            <div class="section-title">
                <h2>Product Management</h2>
                <span id="statusText">Ready</span>
            </div>


            <!-- Start Of Operations -->
            <div class="operations">

                <button id="createBtn" class="operation active">
                    Create
                </button>

                <button id="readAllBtn" class="operation">
                    Read All
                </button>

                <button id="readOneBtn" class="operation">
                    Read One
                </button>

                <button id="updateBtn" class="operation">
                    Update
                </button>

                <button id="deleteBtn" class="operation danger">
                    Delete
                </button>

                <button id="filterBtn" class="operation">
                    Filter
                </button>

                <input
                    id="searchValue"
                    type="text"
                    placeholder="ID / Search keyword"
                >

                <button id="exitBtn" class="operation exit">
                    Exit
                </button>

            </div>
            <!-- End Of Operations -->


            <!-- Start Of Form -->
            <form id="productForm">

                <div class="field">
                    <label for="productId">Product ID</label>

                    <input
                        id="productId"
                        type="number"
                        placeholder="For Read / Update / Delete"
                    >
                </div>


                <div class="field">
                    <label for="productName">Product Name</label>

                    <input
                        id="productName"
                        type="text"
                        placeholder="e.g. Keyboard"
                    >
                </div>


                <div class="field">
                    <label for="productPrice">Price</label>

                    <input
                        id="productPrice"
                        type="number"
                        min="0"
                        placeholder="e.g. 500"
                    >
                </div>


                <div class="field">
                    <label for="productCategory">Category</label>

                    <input
                        id="productCategory"
                        type="text"
                        placeholder="e.g. Electronics"
                    >
                </div>


                <div class="field">
                    <label for="productQuantity">Quantity</label>

                    <input
                        id="productQuantity"
                        type="number"
                        min="0"
                        placeholder="e.g. 10"
                    >
                </div>


                <div class="form-actions">

                    <button id="submitBtn" type="submit">
                        Add Product
                    </button>

                    <button id="clearBtn" type="button" class="secondary">
                        Clear
                    </button>

                </div>

            </form>
            <!-- End Of Form -->


            <div id="message" class="message" aria-live="polite"></div>

        </section>
        <!-- End Of Section One -->


        <!-- Start Of Section Two -->
        <section class="table-panel">

            <div class="section-title">

                <h2>Products</h2>

                <span id="productCount">
                    4 products
                </span>

            </div>


            <!-- Start Of Table -->
            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>Action</th>
                        </tr>

                    </thead>


                    <tbody id="productsBody"></tbody>

                </table>

            </div>
            <!-- End Of Table -->


            <p id="emptyState" class="empty">
                No products to display.
            </p>

        </section>
        <!-- End Of Section Two -->

    </main>
    <!-- End Of Main Content -->


    <script src="index.js"></script>

</body>

</html>
